[package]
name = "elevator_lib"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

# Kütüphane olarak kullanılacak şekilde yapılandırma
[lib]
path = "src/lib.rs"

[[bin]]
name = "elevator_bin"
path = "src/main.rs"

[dependencies]
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
chrono = "0.4"
csv = "1.1"
plotters = "0.3"
pyo3 = { version = "0.15", features = ["extension-module"] }
